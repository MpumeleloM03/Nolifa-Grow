name: nolifa_grow
description: AI-powered plant disease diagnostic app for Southern African farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Shared with the Ubuntu Drop app
  supabase_flutter: ^2.8.0
  timezone: ^0.11.0
  ubuntu_core:
    path: packages/ubuntu_core

  # Firebase

  # TFLite Inference
  tflite_flutter: ^0.12.0

  # Image Acquisition
  camera: ^0.11.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  image: ^4.1.7

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Connectivity
  connectivity_plus: ^6.0.1

  # Navigation
  go_router: ^14.1.0

  # Utilities
  path_provider: ^2.1.3
  uuid: ^4.4.0
  logger: ^2.3.0

  http: ^1.2.1

  # Herd import/export from other tag vendors
  csv: ^6.0.0

  shared_preferences: ^2.3.2

  flutter_tts: ^4.0.2
  
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.2







dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0



flutter:
  uses-material-design: true
  assets:
    - assets/models/plant_model.tflite
    - assets/labels/labels.txt
    - assets/images/placeholder.txt
  
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 26


flutter_native_splash:
  color: "#2D6A4F"
  image: assets/images/app_icon.png
  android: true
  ios: true
